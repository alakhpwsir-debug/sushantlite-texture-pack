name: Build & validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generator tests
        run: python -m unittest discover -s tools/tests -v

      - name: Pack is in sync with the generators
        run: python tools/generate.py --check

      - name: Validate against 1.21.11, 26.1.2, 26.2 and 26.3
        run: python tools/validate.py --strict

      - name: Build zips
        run: python tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: SushantLite
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build release zips
        run: python tools/build.py --version "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "SushantLite $GITHUB_REF_NAME" --generate-notes
